<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="data:,">
        <title>Wortelworm's Redirection Engine</title>

        <script>
        'strict';

        // TODO:
        //   Abuse hash for browser side caching of this html document?
        //   button for manual refresh of cache
        //   parse and use the format flags (`fmt`)
        //   parse and use regex's (like for subreddit defined search)
        //   search suggestions
        //   add type to the `response` of fetch().json()
        //   favicon?
        //   reduce duplicated code

        // Change settings here.
        // This is also an overvew of all url's used.
        const bangs_json_source = 'https://raw.githubusercontent.com/kagisearch/bangs/refs/heads/main/data/bangs.json';
        const search_suggestions = 'todo';
        const default_search_engine = 'https://duckduckgo.com/?q={{{s}}}&ia=web';
        const cache_valid_days = 30;

        // Add custom bangs here!
        let current_page = window.location.origin + window.location.pathname;
        const custom_bangs = {
            'wortel': {u: current_page, d: current_page},
        }

        // Code starts here, with variables for state
        let queued_query = null;
        let bangs_cache_state = null;
        const last_refresh_key = 'wortel-last-localstorage-refresh';

        // Will be 'null' when the body is loaded.
        let deferred = [];
        function defer_exec(f) {
            if (deferred == null) {
                f()
            } else {
                deferred.push(f);
            }
        }

        // I don't know how to properly do colors...
        // This will do (for now).
        const color_red = 'oklch(75% 0.3 30)';
        const color_yellow = 'oklch(90% 0.25 100)';
        const color_green = 'oklch(75% 0.3 140)';

        function set_status(text, color) {
            defer_exec(() => {
                document.querySelector('#status-text').textContent = text;
                document.querySelector('#status-led').style['background-color'] = color;
            });
        }

        // Fetches bangs from kagi and puts them into localStorage.
        async function raw_fetch_bangs() {
            localStorage.clear();
            localStorage.setItem(last_refresh_key, Date.now());
            console.log('Updating cache');

            const response = await ((await fetch(bangs_json_source)).json());
            response.forEach((entry) => {
                // See also:
                // https://github.com/kagisearch/bangs/#bang-format
                // https://github.com/kagisearch/bangs/blob/main/data/bangs.schema.json
                if(entry.u && entry.t && entry.d && entry.s == null) { throw new Error(); }

                // extracting 'true' url, this is relevant for bangs like `!cpp`.
                let url = entry.u;
                if(entry.d === "kagi.com") {
                    if(entry.s.startsWith('Kagi ')) {
                        // Exclude any kagi specific bangs, for which you need an account.
                        return;
                    }

                    let prefix = '/search?q='
                    if(!entry.u.startsWith(prefix) || !entry.u.includes('{{{s}}}')) { throw new Error(); }
                    url = default_search_engine.replace('{{{s}}}', entry.u.slice(prefix.length));
                }

                [entry.t, ...entry.ts ?? []].forEach((trigger) => {
                    localStorage.setItem(trigger, JSON.stringify({u: url, d: 'https://' + (entry.ad ?? entry.d)}));
                });
            });
        }

        // Load bangs from custom and kagi into localStorage.
        async function update_bangs_cache() {
            if (bangs_cache_state === 'loading') {
                return;
            }

            bangs_cache_state = 'loading';
            set_status('Fetching bangs...', color_yellow)

            try {
                let last_update = localStorage.getItem(last_refresh_key);
                if (last_update != null) {
                    let minutes = (Date.now() - new Date(1*last_update)) / 1000 / 60;

                    console.log(`It has been ${Math.round(minutes * 10) / 10} mins since last cache update.`)

                    if (!isNaN(minutes) && Math.abs(minutes / 60 / 24) < cache_valid_days) {
                        bangs_cache_state = 'ready';
                        set_status('Ready!', color_green);

                        if (queued_query !== null) {
                            await perform_query(queued_query);
                            queued_query = null;
                        }
                        return;
                    }
                }

                await raw_fetch_bangs();
            } catch(e) {
                set_status('Could not retrieve bangs :(', color_red);
                throw e;
            }

            for(let key in custom_bangs) {
                localStorage.setItem(key, JSON.stringify(custom_bangs[key]));
            }

            bangs_cache_state = 'ready';
            set_status('Ready!', color_green)

            if (queued_query !== null) {
                await perform_query(queued_query);
                queued_query = null;
            }
        }

        // Immediately start 'background process' of caching the bangs.
        update_bangs_cache();

        function get_bang(name) {
            if (bangs_cache_state !== 'ready') { alert('error'); throw null; }
            return localStorage.getItem(name);
        }

        function perform_redirect(url, search, add_to_history) {
            // By default, duckduckgo redirects users from query with spaces URI encoded to query with plusses.
            // This clutters up the browser history, so do it for them.
            // Kagi actually also does this by default, but it can be turned off using the `fmt` flags.
            let encoded_search = encodeURIComponent(search).replace('%20', '+')
            let filled_url = url.replace('{{{s}}}', encoded_search);

            if (add_to_history) {
                window.history.pushState({}, '', window.location.href);
            }

            window.location.replace(filled_url);
        }

        async function perform_query(query, add_to_history) {
            if (bangs_cache_state !== 'ready') {
                queued_query = query;
                return;
            }

            let search_engine = default_search_engine;

            let words = query.split(' ');
            for(let i = 0; i < words.length; i++) {
                if (words[i].startsWith('!')) {
                    let bang_json = get_bang(words[i].slice(1));
                    if (bang_json == null) continue;

                    let bang = JSON.parse(bang_json);

                    words.splice(i, 1);
                    query = words.join(' ');

                    if(query === '') {
                        // In this case it is not really a 'search_engine', but this works.
                        search_engine = bang.d;
                    } else {
                        search_engine = bang.u;
                    }
                    break;
                }
            }

            perform_redirect(search_engine, query, add_to_history);
        }

        let search_param = new URLSearchParams(window.location.search).get('q');
        if(search_param ?? '' != '') {
            perform_query(search_param);
            defer_exec(() => document.querySelector('input').value = search_param);
        }

        // Code must be run after the body below has loaded.
        function body_load() {
            document.querySelector('#no-js-notice').style.display = 'none';
            document.querySelector('main').removeAttribute('style');
            document.querySelector('form').addEventListener('submit', (event) => {
                event.preventDefault();
                perform_query(document.querySelector('input').value, true);
            })
            document.querySelector('input').focus();

            let tmp = deferred;
            deferred = null;
            tmp.forEach(f => f());
        }
        </script>

        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            white-space: nowrap;
        }

        :root {
            --background: oklch(20% 0 0deg);
            --text: oklch(90% 0 0deg);

            --cursor-highlight: oklch(75% 0.25 260deg);
            --diff: 0.1;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --background: oklch(99.5% 0 0deg);
                --text: oklch(20% 0 0deg);

                --cursor-highlight: oklch(55% 0.25 260deg);
                --diff: -0.1
            }
        }

        body {
            background: var(--background);
            color: var(--text);
            caret-color: var(--cursor-highlight);
        }

        main {
            margin-top: calc((100vh - 3em) / 4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5em;
        }

        form {
            display: flex;
            width: calc(min(100vw - 1em, 35em));
            border: none;
            border-radius: 1em;

            background-color: oklch(from var(--background) calc(l + var(--diff)) c h);
        }
        form:has(> :focus) {
            outline: 2px solid var(--cursor-highlight);
        }

        input {
            border-radius: 1em;
            padding: 0.75em;
            color: inherit;
            background-color: inherit;
            border: none;
        }
        input[type="submit"] {
            cursor: pointer;
        }
        input:focus {
            outline: none;
        }
        </style>
    </head>

    <body onload="body_load()">
        <p id="no-js-notice">This document requires javascript to function.</p>
        <main style="display: none;">
            <!-- Header -->
            <div>
                <h1 style="font-size: 2em; text-align: center;">
                    Wortelworm's <br/> Redirection Engine
                </h1>
            </div>

            <!-- Search bar -->
            <form>
                <input
                    type="text"
                    style="flex-grow: 1;"
                    placeholder="Search anything"
                    name="q"
                    required minlength="1"
                />
                <input
                    type="submit"
                    value="🔍"
                />
            </form>

            <!-- Status texts -->
            <div style="display: flex; gap: 0.2em; align-items: center;">
                <div id="status-led" style="width: 1em; height: 1em; border-radius: 1em;"></div>
                <p id="status-text"></p>
            </div>
        </main>
    </body>
</html>
